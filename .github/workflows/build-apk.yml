name: Build JVHD APK

on:
  workflow_dispatch: {}
  push:
    branches: [ main, 'arena/**' ]
  pull_request:

permissions:
  contents: write

env:
  ANDROID_API: '33'
  ANDROID_BUILD_TOOLS: '34.0.0'
  APKTOOL_VERSION: '2.10.0'

jobs:
  build:
    name: Build JVHD.apk
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify APK username-hash formula (auth regression test)
        run: |
          set -euo pipefail
          echo "Running scripts/test_auth_hash.js — asserts the APK computes"
          echo "SHA-256(lowercase(username) + SALT) which the auth server checks"
          echo "against Hash4.txt. Fails the build if the formula ever drifts."
          node scripts/test_auth_hash.js

      - name: Verify APK auth flow + error handling (auth flow regression test)
        run: |
          set -euo pipefail
          echo "Running scripts/test_auth_flow.js — loads the real assets/app.js in a"
          echo "stubbed WebView and drives the real login gate against a scripted server."
          echo "It asserts: success for the old protocol AND alternative API shapes"
          echo "({success:true}/{valid:true}/token/user), differentiated error messages"
          echo "(5xx / 400 / offline / invalid JSON / wrong Salt.txt / allowlist unloaded),"
          echo "no 3-attempt lock for non-credential faults, Salt.txt validation, and"
          echo "that a response format change can never surface as a wrong username."
          echo "Fails the build if the login gate or its error handling regresses."
          node scripts/test_auth_flow.js

      # Read-only probe of the deployed auth server. It answers the question the
      # APK cannot: is the login failing because of the APK, or because the
      # server is running different code / an empty or stale allowlist?
      # It never runs on ordinary pushes: only on a manual "Run workflow" or on
      # a commit whose message contains [diagnose]. It cannot change any data
      # (GET /health + POST /auth/start only; /auth/bind is never called).
      - name: Diagnose deployed auth server (read-only)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[diagnose]')
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "Read-only diagnostic against $JVHD_AUTH_BASE"
          echo "Calls GET /health and POST /auth/start only - no binding is created or changed."
          { echo '## Auth server diagnostic (read-only)'; echo '```';
            node scripts/diagnose_auth_server.js "$JVHD_AUTH_BASE" | tee /tmp/diag.txt;
            echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          # Also publish the whole result as a check annotation: the raw job log
          # is archived, an annotation stays readable from the Checks API/UI.
          MSG=$(sed -e 's/%/%25/g' -e 's/\r/%0D/g' /tmp/diag.txt | sed ':a;N;$!ba;s/\n/%0A/g' | head -c 60000)
          echo "::notice title=Auth server diagnostic (read-only)::${MSG}"
        env:
          JVHD_AUTH_BASE: https://jvhd-auth.onrender.com
          JVHD_DIAG_LIMIT: '6'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (manual - replaces android-actions/setup-android@v3 which fails on Node 24)
        run: |
          set -euo pipefail
          export ANDROID_HOME="${HOME}/android-sdk"
          export ANDROID_SDK_ROOT="${ANDROID_HOME}"
          mkdir -p "${ANDROID_HOME}/cmdline-tools"
          cd /tmp
          echo "Downloading Android commandline-tools..."
          # Use latest commandline-tools (11076708) - stable URL
          curl -fsSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf "${ANDROID_HOME}/cmdline-tools/latest"
          unzip -q cmdline-tools.zip -d "${ANDROID_HOME}/cmdline-tools"
          mv "${ANDROID_HOME}/cmdline-tools/cmdline-tools" "${ANDROID_HOME}/cmdline-tools/latest"
          rm -f cmdline-tools.zip
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/platform-tools:${PATH}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "${GITHUB_ENV}"
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          echo "${ANDROID_HOME}/platform-tools" >> "${GITHUB_PATH}"
          echo "sdkmanager version: $(sdkmanager --version)"
          yes | sdkmanager --licenses >/dev/null || true
          echo "Installing platform-tools, platforms;android-${ANDROID_API}, build-tools;${ANDROID_BUILD_TOOLS}..."
          sdkmanager --install "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${ANDROID_BUILD_TOOLS}"
          echo "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}" >> "${GITHUB_PATH}"
          ls -l "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/" | head -n 20
          test -x "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/zipalign"
          test -x "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          test -x "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"
          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/aapt2" version

      - name: Install Android platform 33 and build-tools 34.0.0 (verify)
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          ls -l "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/" | head -n 20
          test -x "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/zipalign"
          test -x "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          test -x "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"
          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/aapt2" version

      - name: Show toolchain versions
        run: |
          java -version
          python3 --version
          echo "ANDROID_HOME=${ANDROID_HOME}"

      # The build script is the single source of truth for the pipeline.
      # - mkdir -p build: tee must be able to create build/build.log even when
      #   the script dies before creating any output directory (fresh checkout
      #   has no build/ because it is gitignored).
      # - pipefail: the step must fail when the build script fails, otherwise
      #   the exit status of tee would mask the real build error.
      # The log is uploaded by the "Upload build log" step below, which runs
      # even when this step fails.
      - name: Build, zipalign, sign and verify JVHD.apk
        run: |
          set -euo pipefail
          mkdir -p build
          bash scripts/build-apk.sh 2>&1 | tee build/build.log

      - name: Independent verification with Android SDK tools
        run: |
          set -euo pipefail
          APK=build/outputs/apk/JVHD.apk
          BT="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}"
          test -f "$APK"

          # compiled manifest identity
          "$BT/aapt2" dump badging "$APK" | tee build/ci-badging.txt
          grep -q "package: name='com.JVHD.vip'" build/ci-badging.txt
          grep -q "launchable-activity: name='com.JVHD.vip.MainActivity'" build/ci-badging.txt
          grep -q "sdkVersion:'21'" build/ci-badging.txt
          grep -q "targetSdkVersion:'33'" build/ci-badging.txt

          # zip alignment and signature
          "$BT/zipalign" -c -v -p 4 "$APK" | tail -5
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee build/ci-apksigner-verify.txt
          grep -q "^Verifies" build/ci-apksigner-verify.txt

          # required entries
          unzip -l "$APK" | tee build/ci-apk-contents.txt
          for entry in classes.dex classes2.dex assets/app.js AndroidManifest.xml \
                       lib/arm64-v8a/libbtcore.so lib/armeabi-v7a/libbtcore.so; do
            grep -q "$entry" build/ci-apk-contents.txt
          done

          # native libraries inside the APK must be byte-identical to the sources
          rm -rf build/apk-extract && mkdir -p build/apk-extract
          unzip -o -q "$APK" 'lib/*' 'assets/app.js' -d build/apk-extract
          sha256sum lib/arm64-v8a/libbtcore.so lib/armeabi-v7a/libbtcore.so assets/app.js
          sha256sum build/apk-extract/lib/arm64-v8a/libbtcore.so \
                    build/apk-extract/lib/armeabi-v7a/libbtcore.so \
                    build/apk-extract/assets/app.js
          diff <(sha256sum < lib/arm64-v8a/libbtcore.so | cut -d' ' -f1) \
               <(sha256sum < build/apk-extract/lib/arm64-v8a/libbtcore.so | cut -d' ' -f1)
          diff <(sha256sum < lib/armeabi-v7a/libbtcore.so | cut -d' ' -f1) \
               <(sha256sum < build/apk-extract/lib/armeabi-v7a/libbtcore.so | cut -d' ' -f1)
          diff <(sha256sum < assets/app.js | cut -d' ' -f1) \
               <(sha256sum < build/apk-extract/assets/app.js | cut -d' ' -f1)

          # class level verification straight out of the DEX files
          rm -rf build/apk-dex && mkdir -p build/apk-dex
          unzip -o -q "$APK" 'classes*.dex' -d build/apk-dex
          if [ -x "$BT/dexdump" ]; then
            : > build/dex-classes.txt
            for dex in build/apk-dex/classes*.dex; do
              echo "--- $dex" >> build/dex-classes.txt
              "$BT/dexdump" "$dex" | grep "Class descriptor" >> build/dex-classes.txt
            done
            for cls in MainActivity TizenBridge MediaProxyServer BtK; do
              grep -q "Lcom/JVHD/vip/${cls};" build/dex-classes.txt
            done
            grep -c "Class descriptor" build/dex-classes.txt
          else
            echo "dexdump not available in build-tools, relying on scripts/verify_apk.py"
          fi
          python3 scripts/verify_apk.py --apk "$APK" --project . \
            --badging build/ci-badging.txt --signature-report build/ci-apksigner-verify.txt

      - name: Publish build summary
        if: always()
        run: |
          {
            echo "### JVHD.apk"
            echo
            if [ -f build/outputs/apk/JVHD.apk ]; then
              echo '```'
              ls -l build/outputs/apk/JVHD.apk
              sha256sum build/outputs/apk/JVHD.apk
              echo '```'
            else
              echo "APK was not produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JVHD.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: JVHD-apk-debug
          path: |
            build/outputs/apk/JVHD.apk
            build/outputs/apk/JVHD.apk.sha256
            build/badging.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JVHD-build-log
          path: |
            build/build.log
            build/*.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release with JVHD.apk (only on main push)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=build/outputs/apk/JVHD.apk
          test -f "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG="v1.0.7-${SHORT_SHA}-b${GITHUB_RUN_NUMBER}"
          echo "Creating release $TAG from commit $GITHUB_SHA"
          echo "APK SHA256: $SHA"
          ls -lh "$APK"
          # Create release notes with build provenance
          cat > /tmp/release_notes.md <<EOF
          JVHD.apk build from commit ${GITHUB_SHA}

          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Commit: ${SHORT_SHA}
          - APK SHA256: ${SHA}
          - Package: com.JVHD.vip
          - Launcher: com.JVHD.vip.MainActivity
          - Build: ${GITHUB_RUN_NUMBER}

          Fixes:
          - VIDEO HD black screen/audio-only (hardware layer + hls.js for HLS)
          - Auth 405 (removed /health warm-up)
          - Theme black/white unified
          - CI Node 24 compat (manual Android SDK install)

          Baseline:
          - LOGIN OK
          - CONFIG OK (TargetUrl.txt from GitLab)
          - LIVE OK
          - NEW LIVE OK
          - New VIDEO OK
          - PRN HUB OK
          - VIDEO HD fixed (hardware layer + hls.js)

          Install: adb install -r JVHD.apk
          EOF
          gh release create "$TAG" "$APK" --title "JVHD.apk $TAG" --notes-file /tmp/release_notes.md --latest || {
            echo "Release creation failed, trying to upload asset to existing release..."
            gh release upload "$TAG" "$APK" --clobber || true
          }
          echo "Release $TAG created with JVHD.apk"
          gh release view "$TAG" --json assets,tagName,url --jq '.url, .assets[].name'
