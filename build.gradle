// JVHD.apk packaging project.
//
// This is NOT a Java/Kotlin rewrite. The repository is the decompiled apktool
// project (smali/, smali_classes2/, res/, assets/, lib/, AndroidManifest.xml),
// and the real build is a Smali assembly:
//
//   decompiled apktool project
//        -> apktool 2.10.0 "b"   (smali -> classes.dex / classes2.dex, aapt2 link)
//        -> zipalign -p 4
//        -> apksigner (debug keystore)
//        -> build/outputs/apk/JVHD.apk  (verified)
//
// The pipeline is implemented once, in scripts/build-apk.sh, and is invoked by
// Gradle, by the GitHub Actions workflow and by local builds, so there is a
// single implementation that cannot drift:
//
//     gradle assembleDebug        # or: bash scripts/build-apk.sh

def pipelineScript = layout.projectDirectory.file('scripts/build-apk.sh')

tasks.register('assembleDebug', Exec) {
    group = 'build'
    description = 'Assemble the Smali sources, zipalign, sign and verify build/outputs/apk/JVHD.apk'
    workingDir = layout.projectDirectory
    commandLine 'bash', pipelineScript.asFile.absolutePath
}

tasks.register('buildJvhdApk') {
    group = 'build'
    description = 'Alias of assembleDebug'
    dependsOn tasks.named('assembleDebug')
}
